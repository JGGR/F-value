[package]
name = "esox"
version = "0.0.16"
edition = "2021"

[features]

logged = ["dep:flexi_logger", "dep:dirs", "dep:log"]

[dependencies]
chrono = "0.4.39"
csv = "1.3.1"
dirs = { version = "6.0.0", optional = true }
flexi_logger = { version = "0.30.1", optional = true }
log = { version = "0.4.27", optional = true }
once_cell = "1.20.2"
raylib = { git = "https://github.com/raylib-rs/raylib-rs.git", features = [
    "raygui",
] }
rfd = "0.15.1"
serde = { version = "1.0.216", features = [ "derive" ] }
uuid = { version = "1.15.1", features = ["v4"] }
