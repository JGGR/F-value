[package]
name = "esox"
version = "0.0.33"
edition = "2021"

[features]
default = ["embed-icon"]
embed-icon = []

[build-dependencies]
chrono = "0.4.39"

[dependencies]
chrono = "0.4.42"
csv = "1.4.0"
dirs = "6.0.0"
flexi_logger = "0.31.7"
image = "0.25.9"
locale_config = "0.3.0"
log = "0.4.28"
miniz_oxide = "0.8.9"
once_cell = "1.21.3"
pdf-writer = "0.14.0"
raylib = { git = "https://github.com/raylib-rs/raylib-rs.git", features = [
    "raygui",
] }
rfd = "0.15.4"
serde = { version = "1.0.228", features = [ "derive" ] }
uuid = { version = "1.18.1", features = ["v4"] }
