[package]
name = "f_value"
version = "0.1.2"
edition = "2021"
description = "Tool for NISECI and HFBI calc"
license = "GPL-3.0-only"
exclude = [
    ".github/**",
    "assets",
    "templates",
]

[features]
default = ["embed-icon"]
embed-icon = []

[build-dependencies]
chrono = "0.4.39"

[dependencies]
chrono = "0.4.39"
dirs = "6.0.0"
esox = "0.1.2"
locale_config = "0.3.0"
miniz_oxide = "0.8.9"
pdf-writer = "0.14.0"
png = "0.18.1"
raylib = { git = "https://github.com/raylib-rs/raylib-rs.git", features = [
    "raygui",
] }
rfd = { version = "0.15.4", default-features = false, features = [ "gtk3" ] }
uuid = { version = "1.18.1", features = ["v4"] }
